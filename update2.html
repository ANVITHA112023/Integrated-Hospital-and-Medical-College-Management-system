<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Signup</title>
</head>
<body>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #81ecec, #74b9ff);
            color: #2d3436;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    
        .container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    
        h1 {
            text-align: center;
            font-size: 28px;
            color: #0984e3;
            margin: 0 0 10px;
        }
    
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    
        label {
            font-size: 14px;
            font-weight: bold;
            color: #2d3436;
        }
    
        input[type="text"], input[type="number"], input[type="submit"] {
            padding: 12px;
            font-size: 14px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            background: #f9fbfc;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }
    
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #0984e3;
            outline: none;
            box-shadow: 0 0 8px rgba(9, 132, 227, 0.2);
            background: #ffffff;
        }
    
        input[type="submit"] {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: #0984e3;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
    
        input[type="submit"]:hover {
            background: #74b9ff;
            transform: translateY(-2px);
        }
    
        input[type="submit"]:active {
            transform: translateY(0);
        }
    
        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
    
            h1 {
                font-size: 24px;
            }
    
            label {
                font-size: 13px;
            }
    
            input[type="text"], input[type="number"], input[type="submit"] {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
    <div class="container">
        <h1>Employee Signup</h1>
        <form action="update2.php" method="post">
           
            <label for="E_name">Username:</label>
            <input type="text" id="E_name" name="E_name"><br>

            <label for="E_id">id:</label>
            <input type="number" id="E_id" name="E_id"><br>
          
            <label for="Phone_no">Phone_no:</label>
            <input type="number" id="Phone_no" name="Phone_no"  maxlength="10" title="Please enter exactly 10 digits."><br>
          
            <label for="E_type">Employee type:</label>
            <input type="text" id="E_type" name="E_type"><br>
          
            <input type="submit" name="submit" value="Update">
          </form>
          
</body>
</html>
